[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-app-factory"
version = "0.1.0"
description = "Lightweight governed agentic software factory for UPI dispute resolution case management"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.8",
]

[tool.pytest.ini_options]
addopts = [
  "-p",
  "no:cacheprovider",
  "--import-mode=importlib",
]
norecursedirs = [
  ".*",
  "build",
  "dist",
  "CVS",
  "_darcs",
  "{arch}",
  "*.egg",
  "venv",
  "workspace/deep_engineering_campaign",
  "workspace/factory_generated/upi_failed_debit_no_credit",
  "workspace/factory_generated/post_r9_5",
  "workspace/regeneration_runs",
  "workspace/tmp",
]

[tool.setuptools.packages.find]
include = ["app*", "factory*", "adapters*", "upi_factory*"]
exclude = [
  "tests*",
  "prompts*",
  "evidence*",
  "workspace*",
  "factory_governance*",
  "scripts*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
exclude = [
  "^factory_governance/baseline_original/",
  "^workspace/",
]
python_version = "3.10"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
