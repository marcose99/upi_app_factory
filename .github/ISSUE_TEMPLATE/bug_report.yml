name: Bug report
description: Report a reproducible problem in the documented local/mock routes
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve UPI App Factory. Do not include secrets, real customer data, payment credentials, or private exploit details.
  - type: input
    id: revision
    attributes:
      label: Exact Git revision
      description: Run `git rev-parse HEAD`.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - Native Ubuntu/Linux
        - Docker on Linux
        - Docker Desktop on macOS
        - Docker Desktop on Windows
        - Documentation only
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide minimal sanitized steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste sanitized output only.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, real customer data and payment credentials.
          required: true
        - label: This report does not contain private vulnerability/exploit details; security-sensitive reports follow SECURITY.md.
          required: true
